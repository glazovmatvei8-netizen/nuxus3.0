<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; margin: 0; italic; }
        p { opacity: 0.6; font-size: 14px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.2em; margin-top: 10px; }
        .btn {
            margin-top: 40px;
            padding: 15px 40px;
            background: #8B5CF6;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="icon">🛰️</div>
    <h1>Связь потеряна</h1>
    <p>Ядро Nuxus перешло в автономный режим</p>
    <a href="/" class="btn">Обновить сигнал</a>
</body>
</html>
