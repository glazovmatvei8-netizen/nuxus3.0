
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8B5CF6, #0EA5E9);
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 40px;
        }
        h1 { font-size: 24px; font-weight: 900; margin: 0 0 8px 0; text-transform: uppercase; font-style: italic; }
        p { color: rgba(255,255,255,0.5); font-size: 14px; max-width: 250px; line-height: 1.5; }
        .btn {
            margin-top: 32px;
            padding: 12px 32px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 16px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="icon">N</div>
    <h1>Нет связи</h1>
    <p>Ядро Nuxus ожидает восстановления интернет-соединения.</p>
    <a href="/" class="btn">Повторить попытку</a>
</body>
</html>
