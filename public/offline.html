
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        p { opacity: 0.6; font-size: 14px; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="icon">🛰️</div>
    <h1>Связь потеряна</h1>
    <p>Ядро Nuxus ожидает восстановления сигнала...</p>
    <button onclick="window.location.reload()" style="margin-top: 20px; background: #8B5CF6; border: none; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">Попробовать снова</button>
</body>
</html>
