<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8B5CF6 0%, #C084FC 100%);
            border-radius: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; font-style: italic; }
        p { color: rgba(255, 255, 255, 0.5); font-size: 14px; max-width: 250px; }
        .btn {
            margin-top: 32px;
            background: white;
            color: black;
            padding: 12px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
    </div>
    <h1>Нет связи</h1>
    <p>Ядро Nuxus ожидает восстановления интернет-сигнала...</p>
    <a href="/" class="btn">Попробовать снова</a>
</body>
</html>
