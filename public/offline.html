
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        p { opacity: 0.6; font-size: 14px; max-width: 250px; }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="icon">🛰️</div>
    <h1>Связь потеряна</h1>
    <p>Ядро Nuxus перешло в автономный режим. Проверьте подключение к сети.</p>
</body>
</html>
