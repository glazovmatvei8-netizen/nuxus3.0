
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн режим</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8B5CF6, #C084FC);
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            margin: 0 0 8px 0;
            letter-spacing: -0.05em;
        }
        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            max-width: 250px;
            line-height: 1.5;
        }
        .btn {
            margin-top: 32px;
            background-color: #8B5CF6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <h1>Nuxus Offline</h1>
    <p>Ядро потеряло связь. Проверьте интернет, чтобы продолжить общение.</p>
    <button class="btn" onclick="window.location.reload()">Обновить ядро</button>
</body>
</html>
