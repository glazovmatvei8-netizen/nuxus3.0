<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .core {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            border-radius: 50%;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        h1 { font-weight: 900; font-style: italic; letter-spacing: -0.05em; margin: 0; }
        p { opacity: 0.6; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; letter-spacing: 0.2em; margin-top: 10px; }
        button {
            margin-top: 30px;
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="core"></div>
    <h1>ЯДРО ОФЛАЙН</h1>
    <p>Подключение к Nuxus потеряно</p>
    <button onclick="window.location.reload()">Повторить попытку</button>
</body>
</html>
