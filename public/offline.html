
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8B5CF6 0%, #0EA5E9 100%);
            border-radius: 25px;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        h1 { font-size: 24px; font-weight: 900; text-transform: uppercase; font-style: italic; margin: 0; letter-spacing: -0.05em; }
        p { color: rgba(255, 255, 255, 0.5); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 8px; }
        .btn {
            margin-top: 32px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px border rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <h1>Nuxus Kernel</h1>
    <p>Соединение с Ядром потеряно</p>
    <a href="/" class="btn">Повторить попытку</a>
</body>
</html>
