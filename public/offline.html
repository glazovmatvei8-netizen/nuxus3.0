
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн режим</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }
        h1 { font-weight: 900; text-transform: uppercase; font-style: italic; letter-spacing: -0.05em; }
        p { opacity: 0.6; font-size: 14px; max-width: 280px; }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(1); }
        }
        .btn {
            margin-top: 32px;
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="icon">🛰️</div>
    <h1>Связь потеряна</h1>
    <p>Ядро Nuxus перешло в автономный режим. Проверьте подключение к сети.</p>
    <button class="btn" onclick="window.location.reload()">Повторить попытку</button>
</body>
</html>
