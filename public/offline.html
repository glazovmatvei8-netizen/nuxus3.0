<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-col: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { padding: 20px; }
        .logo { font-size: 48px; font-weight: 900; font-style: italic; color: #8B5CF6; margin-bottom: 20px; }
        h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        p { opacity: 0.6; font-size: 14px; max-width: 300px; margin: 20px auto; }
        button {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">NUXUS</div>
        <h1>Ядро вне сети</h1>
        <p>Соединение с квантовым узлом потеряно. Проверьте подключение к интернету.</p>
        <button onclick="window.location.reload()">Обновить</button>
    </div>
</body>
</html>
