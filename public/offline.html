
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxus — Офлайн</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(139,92,246,0.5)); }
        h1 { font-weight: 900; text-transform: uppercase; font-style: italic; letter-spacing: -0.05em; }
        p { color: #666; font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.2em; }
        .btn { margin-top: 30px; background: #8B5CF6; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=192&h=192&fit=crop&fm=png" class="logo" alt="Nuxus">
    <h1>Ядро вне сети</h1>
    <p>Проверьте подключение к интернету для синхронизации узлов.</p>
    <button class="btn" onclick="window.location.reload()">Переподключить</button>
</body>
</html>
