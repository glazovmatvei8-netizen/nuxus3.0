>>>>>>> 9ac1a40 (ну а собрать то как твои методы не работают)
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          # Важный шаг: без установки подов нативного проекта Xcode вызовет ошибку сборки
          cd ios/App && pod install

      - name: Build iOS (Xcode)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          # Копируем скомпилированное приложение в структуру Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Nuxus.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuxus-Unsigned-IPA
          path: Nuxus.ipa
