
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Fix manifest for static export
        run: find src/app -name "*manifest*" -exec rm -rf {} + 2>/dev/null || true

      - name: Build Web Project
        run: |
          npm run build
          # Проверка наличия папки out для статического экспорта
          if [ ! -d "out" ]; then
            echo "Error: Directory 'out' not found. Ensure output: 'export' is in next.config.ts"
            exit 1
          fi

      - name: Capacitor Sync & Add
        run: |
          # Гарантируем наличие папки для Capacitor
          mkdir -p out
          
          # Инициализируем iOS если её нет
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # Копируем веб-активы и синхронизируем плагины
          npx cap sync ios
          npx cap copy ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App && pod install

      - name: Build iOS (Xcode)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Nuxus.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuxus-Unsigned-IPA
          path: Nuxus.ipa
