name: Build Android APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project (Static Export to /out)
        env:
          STATIC_EXPORT: 'true'
        run: |
          rm -rf src/app/api/ai
          npm run export
          if [ ! -d "out" ]; then
            echo "Error: Directory 'out' was not generated."
            exit 1
          fi

      - name: Capacitor Add & Sync Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          npx cap copy android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Nuxus-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuxus-Android-APK
          path: Nuxus-v2.0.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0-latest
          name: "Nuxus 2.0 Android APK (Auto-Build)"
          body: "Автоматическая сборка Android-клиента Nuxus 2.0 (протокол QES). Скачайте `Nuxus-v2.0.apk` ниже для установки на смартфон."
          files: Nuxus-v2.0.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
