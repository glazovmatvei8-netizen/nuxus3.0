name: Build Web (Folder OUT)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Static Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project (Export)
        run: npm run build

      - name: Upload OUT Folder as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxus-web-dist
          path: out
          retention-days: 5
