name: Build Web (Folder OUT)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Static Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project (Static Export)
        env:
          STATIC_EXPORT: 'true'
        run: |
          npm run build
          if [ ! -d "out" ]; then
            echo "Error: Directory 'out' was not generated."
            exit 1
          fi

      - name: Prepare Staging for Archive
        run: |
          mkdir -p staging
          cp -r out staging/out

      - name: Upload OUT Folder as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxus-web-dist
          path: staging/out
          retention-days: 5
